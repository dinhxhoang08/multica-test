<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng Ghi chú - Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Danh sách việc cần làm</h1>
        <div class="input-section">
            <input type="text" id="todo-input" placeholder="Thêm việc mới...">
            <button id="add-btn">Thêm</button>
            <button id="clear-btn" class="clear-btn">Xóa tất cả</button>
        </div>
        <ul id="todo-list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
